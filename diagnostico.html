<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba AceServe</title>
<style>
body {
    background: #080808;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}
video {
    width: 100%;
    max-width: 900px;
    background: black;
}
</style>
</head>
<body>

<h2>ACE-AUTO - Prueba AceServe</h2>

<video id="video" controls autoplay playsinline></video>

<p id="estado">Conectando con AceServe...</p>

<script>
const VIDEO =
"http://127.0.0.1:6878/ace/m/191c2708c68317192dc1492722c7901e6431f208/f528764d624db129b32c21fbca0cb8d6.m3u8";

const video = document.getElementById("video");
const estado = document.getElementById("estado");

video.src = VIDEO;

video.addEventListener("loadedmetadata", () => {
    estado.textContent = "Vídeo detectado correctamente.";
});

video.addEventListener("playing", () => {
    estado.textContent = "REPRODUCIENDO CORRECTAMENTE.";
});

video.addEventListener("error", () => {
    estado.textContent = "ERROR: Chrome no puede reproducir directamente este flujo.";
});
</script>

</body>
</html>
