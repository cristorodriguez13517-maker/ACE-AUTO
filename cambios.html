<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE-AUTO - Estadísticas de canales</title>

<style>
:root {
    --fondo: #080808;
    --panel: #151515;
    --rojo: #e50914;
    --verde: #20c878;
    --amarillo: #f5bd42;
    --texto: #ffffff;
    --gris: #999999;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background:
        radial-gradient(ellipse at top left, #301014 0%, transparent 45%),
        var(--fondo);
    color: var(--texto);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    padding: 25px 0;
    border-bottom: 1px solid #333;
    margin-bottom: 25px;
}

.logo {
    color: var(--rojo);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    color: var(--gris);
    margin-top: 8px;
}

.estado {
    background: var(--panel);
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 25px;
    border: 1px solid #292929;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.tarjeta {
    background: var(--panel);
    padding: 25px 12px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #292929;
}

.numero {
    font-size: 38px;
    font-weight: bold;
    display: block;
    margin-bottom: 10px;
}

.tarjeta small {
    color: var(--gris);
    font-size: 12px;
    letter-spacing: 1px;
}

.verde {
    color: var(--verde);
}

.rojo {
    color: var(--rojo);
}

.actualizacion {
    background: var(--panel);
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
}

.fecha {
    color: var(--rojo);
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 18px;
}

.seccion {
    margin-top: 22px;
}

.seccion h3 {
    font-size: 15px;
    letter-spacing: 1px;
}

.seccion ul {
    list-style: none;
    padding: 0;
}

.seccion li {
    padding: 12px;
    margin: 7px 0;
    background: #202020;
    border-radius: 7px;
    border-left: 3px solid #555;
    overflow-wrap: anywhere;
}

.seccion.anadidos li {
    border-left-color: var(--verde);
}

.seccion.eliminados li {
    border-left-color: var(--rojo);
}

.sin-cambios {
    color: var(--gris);
    padding: 12px 0;
}

.boton {
    background: var(--rojo);
    border: none;
    color: white;
    padding: 12px 20px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.boton:active {
    transform: scale(.97);
}

footer {
    color: #666;
    text-align: center;
    padding: 30px 0;
    font-size: 12px;
}

@media(max-width: 550px) {
    body {
        padding: 15px;
    }

    .resumen {
        gap: 8px;
    }

    .numero {
        font-size: 29px;
    }

    .tarjeta {
        padding: 20px 5px;
    }

    .tarjeta small {
        font-size: 10px;
    }

    .logo {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">ACE-AUTO</div>
    <div class="subtitle">Estadísticas y actualizaciones de la lista Elcano</div>
</header>

<div class="estado" id="estado">
    Consultando información...
</div>

<div class="resumen">

    <div class="tarjeta">
        <span class="numero amarillo" id="totalCanales">0</span>
        <small>CANALES TOTALES</small>
    </div>

    <div class="tarjeta">
        <span class="numero verde" id="totalAnadidos">0</span>
        <small>CANALES AÑADIDOS</small>
    </div>

    <div class="tarjeta">
        <span class="numero rojo" id="totalEliminados">0</span>
        <small>CANALES ELIMINADOS</small>
    </div>

</div>

<h2>Última actualización</h2>

<div id="historial">
    Cargando información...
</div>

<button class="boton" onclick="cargarCambios()">
    ↻ ACTUALIZAR
</button>

<footer>
    ACE-AUTO · Estadísticas automáticas de canales
</footer>

</div>

<script>

const ARCHIVO_CAMBIOS = "./cambios.md";
const ARCHIVO_LISTA = "./canales.m3u";

function normalizar(texto) {
    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
}

function leerNumero(texto, tipo) {

    const expresion = new RegExp(
        "^Canales\\s+" + tipo + "\\s*:\\s*(\\d+)\\s*$",
        "im"
    );

    const resultado = texto.match(expresion);

    return resultado ? Number(resultado[1]) : 0;
}

function contarCanales(lista) {

    const coincidencias = lista.match(/^#EXTINF\s*:/gim);

    return coincidencias ? coincidencias.length : 0;
}

function obtenerLista(lineas, nombre) {

    const objetivo = normalizar(nombre);
    let dentro = false;
    const resultado = [];

    for (const lineaOriginal of lineas) {

        const linea = lineaOriginal.trim();

        if (linea.startsWith("### ")) {

            const titulo = normalizar(
                linea.replace(/^###\s+/, "")
            );

            if (dentro) break;

            dentro = titulo === objetivo;
            continue;
        }

        if (dentro && linea.startsWith("- ")) {
            resultado.push(linea.substring(2).trim());
        }
    }

    return resultado;
}

function crearSeccion(titulo, elementos, clase) {

    const seccion = document.createElement("div");
    seccion.className = "seccion " + clase;

    const h3 = document.createElement("h3");
    h3.textContent = titulo;

    seccion.appendChild(h3);

    if (elementos.length === 0) {

        const p = document.createElement("p");
        p.className = "sin-cambios";
        p.textContent = "No hay canales en este apartado.";

        seccion.appendChild(p);
        return seccion;
    }

    const ul = document.createElement("ul");

    elementos.forEach(nombre => {

        const li = document.createElement("li");
        li.textContent = nombre;

        ul.appendChild(li);
    });

    seccion.appendChild(ul);

    return seccion;
}

async function cargarCambios() {

    const estado = document.getElementById("estado");
    const historial = document.getElementById("historial");

    estado.textContent = "Consultando información...";

    try {

        // Descargar los dos archivos al mismo tiempo.
        const [respuestaCambios, respuestaLista] = await Promise.all([

            fetch(
                ARCHIVO_CAMBIOS + "?t=" + Date.now(),
                { cache: "no-store" }
            ),

            fetch(
                ARCHIVO_LISTA + "?t=" + Date.now(),
                { cache: "no-store" }
            )

        ]);

        if (!respuestaCambios.ok) {
            throw new Error("No se encuentra cambios.md");
        }

        if (!respuestaLista.ok) {
            throw new Error("No se encuentra canales.m3u");
        }

        const [textoCambios, textoLista] = await Promise.all([
            respuestaCambios.text(),
            respuestaLista.text()
        ]);

        // Calcular el total real de canales de la lista actual.
        const totalCanales = contarCanales(textoLista);

        // Leer los añadidos y eliminados del último informe.
        const nuevos = leerNumero(textoCambios, "añadidos");
        const eliminados = leerNumero(textoCambios, "eliminados");

        const lineas = textoCambios.split(/\r?\n/);

        const lineaFecha = lineas.find(linea =>
            /^Fecha\s*:/i.test(linea.trim())
        );

        const fecha = lineaFecha
            ? lineaFecha.trim().replace(/^Fecha\s*:\s*/i, "")
            : "Fecha no disponible";

        const anadidos = obtenerLista(lineas, "Añadidos");
        const quitados = obtenerLista(lineas, "Eliminados");

        // Mostrar los tres contadores.
        document.getElementById("totalCanales").textContent = totalCanales;
        document.getElementById("totalAnadidos").textContent = nuevos;
        document.getElementById("totalEliminados").textContent = eliminados;

        // Mostrar el informe.
        historial.replaceChildren();

        const tarjeta = document.createElement("div");
        tarjeta.className = "actualizacion";

        const titulo = document.createElement("div");
        titulo.className = "fecha";
        titulo.textContent = "📅 " + fecha;

        tarjeta.appendChild(titulo);

        const resumen = document.createElement("p");

        resumen.textContent =
            "📺 " + totalCanales + " canales actualmente en la lista · " +
            "🟢 " + nuevos + " añadidos · " +
            "🔴 " + eliminados + " eliminados";

        tarjeta.appendChild(resumen);

        tarjeta.appendChild(
            crearSeccion(
                "🟢 CANALES AÑADIDOS",
                anadidos,
                "anadidos"
            )
        );

        tarjeta.appendChild(
            crearSeccion(
                "🔴 CANALES ELIMINADOS",
                quitados,
                "eliminados"
            )
        );

        historial.appendChild(tarjeta);

        estado.replaceChildren();

        const mensaje = document.createElement("strong");
        mensaje.textContent = "✓ Lista e historial cargados correctamente. ";

        const detalle = document.createElement("small");
        detalle.style.color = "#999";
        detalle.textContent =
            "Última comprobación: " +
            new Date().toLocaleString("es-ES");

        estado.appendChild(mensaje);
        estado.appendChild(detalle);

    } catch (error) {

        estado.textContent = "⚠️ " + error.message;

        historial.textContent =
            "No se ha podido cargar la información. Comprueba que cambios.md y canales.m3u estén publicados junto a cambios.html.";

        console.error(error);
    }
}

cargarCambios();

// Actualización automática cada minuto.
setInterval(cargarCambios, 60000);

</script>

</body>
</html>
