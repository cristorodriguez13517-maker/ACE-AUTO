name: Actualizar ACE-AUTO y GitHub Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

  push:
    paths:
      - "actualizar.py"
      - "preparar_epg.py"
      - "index.html"
      - "canales_manuales.m3u"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Actualizar ACE-AUTO
        env:
          GIT_GAY_TOKEN: ${{ secrets.GIT_GAY_TOKEN }}
        run: |
          python -u actualizar.py

      - name: Preparar datos para GitHub Pages
        run: |
          mkdir -p datos/epg
          test -s datos/canales.m3u
          python -u preparar_epg.py
          touch .nojekyll

      - name: Guardar actualizaciones en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            canales.m3u \
            canales_tdt.m3u \
            canales_radio.m3u \
            historial.json \
            cambios.md \
            datos \
            .nojekyll

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar ACE-AUTO y GitHub Pages"
            git push
          fi
